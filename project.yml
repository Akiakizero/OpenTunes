# SPDX-License-Identifier: GPL-3.0-or-later
name: OpenTunes
options:
  bundleIdPrefix: org.opentunes
  deploymentTarget:
    macOS: "26.0"
  generateEmptyDirectories: true
  groupSortPosition: top
  # L'app è in italiano: date relative, formati e testi di sistema seguono questa lingua.
  developmentLanguage: it

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_HARDENED_RUNTIME: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  MediaCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/MediaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opentunes.MediaCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  OpenTunes:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/DesignSystem
    dependencies:
      - target: MediaCore
      - package: KeyboardShortcuts
    # Chiave Last.fm del progetto: dalle variabili d'ambiente LASTFM_API_KEY e LASTFM_API_SECRET
    # (segreti del workflow di release). Senza, l'utente inserisce la propria nelle impostazioni.
    info:
      path: Sources/App/Info.plist
      properties:
        LastFMAPIKey: $(LASTFM_API_KEY)
        LastFMAPISecret: $(LASTFM_API_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opentunes.OpenTunes
        PRODUCT_NAME: OpenTunes
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenTunes
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        # App da menu bar: niente icona nel Dock.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "OpenTunes legge il brano in riproduzione e invia play, pausa e salto ad Apple Music e Spotify quando il Now Playing di sistema non è disponibile."
        CODE_SIGN_ENTITLEMENTS: Sources/App/OpenTunes.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    preBuildScripts:
      - name: Build mediaremote-adapter
        script: |
          "${SRCROOT}/scripts/build-mediaremote-adapter.sh"
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Copy mediaremote-adapter into bundle
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/MediaRemoteAdapter"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          ditto "${SRCROOT}/Resources/MediaRemoteAdapter" "$DEST"
          rm -f "$DEST/.built-from"
        basedOnDependencyAnalysis: false

  MediaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MediaCoreTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: MediaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opentunes.MediaCoreTests
        GENERATE_INFOPLIST_FILE: YES

  OpenTunesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OpenTunesTests
    dependencies:
      - target: OpenTunes
      - target: MediaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.opentunes.OpenTunesTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenTunes.app/Contents/MacOS/OpenTunes"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  OpenTunes:
    build:
      targets:
        OpenTunes: all
        MediaCore: all
        MediaCoreTests: [test]
        OpenTunesTests: [test]
    test:
      targets:
        - MediaCoreTests
        - OpenTunesTests
      gatherCoverageData: true
