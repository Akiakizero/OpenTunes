# Pubblica il sito minimo (site/ + GIF di docs/media) su GitHub Pages a ogni push su main che li tocca.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/media/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito
        run: |
          mkdir -p _site/media
          cp site/index.html _site/
          cp docs/media/*.gif _site/media/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
