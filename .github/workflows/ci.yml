# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permessi minimi: la CI legge il codice e basta (anche per le PR da fork).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Azioni fissate per SHA (il commento indica la versione): un tag spostato non può cambiare il codice eseguito.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode disponibili
        run: ls -d /Applications/Xcode*; xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -scheme OpenTunes -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData test
      - name: Crash report dei test
        if: failure()
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/OpenTunes*.ips 2>/dev/null | head -2); do
            echo "=== $f"; head -c 12000 "$f"; echo
          done
