# Analisi di sicurezza del codice con CodeQL: Swift (app, MediaCore, widget) e i workflow di GitHub Actions.
# I risultati compaiono in Security › Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analisi (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            os: macos-26
            build-mode: manual
          - language: actions
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build (Swift)
        if: matrix.language == 'swift'
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate
          xcodebuild -scheme OpenTunes -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
