# SPDX-License-Identifier: GPL-3.0-or-later
# Al push di un tag `v*` compila, esegue i test, crea il .dmg e lo allega a una release GitHub.
name: Release

on:
  push:
    tags: ["v*"]

# Solo questo workflow scrive nel repository (crea la release); parte solo dai tag, che può creare solo chi ha
# accesso in scrittura. I segreti non sono mai disponibili alle PR.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild -scheme OpenTunes -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData test
      - name: Build .dmg
        env:
          # Facoltativi: senza, l'app chiede all'utente la propria API key Last.fm.
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          # Chiave pubblica EdDSA di Sparkle (variabile del repository): senza, l'app non cerca aggiornamenti.
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          # Facoltativo: ID dell'applicazione Discord del progetto (Rich Presence). Senza, l'utente mette il proprio.
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: scripts/make-dmg.sh
      - name: Sparkle appcast
        if: ${{ vars.SPARKLE_PUBLIC_KEY != '' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/make-appcast.sh "$GITHUB_REF_NAME"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # appcast.xml c'è solo con le chiavi di Sparkle configurate.
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 $(ls dist/appcast.xml 2>/dev/null) \
            --title "OpenTunes $GITHUB_REF_NAME" --generate-notes
